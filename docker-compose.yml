services:
  business-operation:
    container_name: business-operation
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3002:3001"
    networks:
      - quantara-network

networks:
  quantara-network:
    external: true
    name: quantara_quantara-network
