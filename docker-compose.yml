services:
  business-operation:
    container_name: business-operation
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3002:3001"
    networks:
      - quantara-network

  notification-worker:
    container_name: notification-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "scripts/notification-worker.mjs"]
    env_file:
      - .env
    networks:
      - quantara-network
    depends_on:
      - business-operation

networks:
  quantara-network:
    external: true
    name: quantara_quantara-network